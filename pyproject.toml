[project]
name = "fct"
version = "0.1.0"
description = "Functional cell types: deep-network training and mean-field theory"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: trains through the CLI for about a minute (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
