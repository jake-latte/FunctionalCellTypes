[project]
name = "fct"
version = "0.1.0"
description = "Functional cell types: deep-network training and mean-field theory"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
